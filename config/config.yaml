rag:
  top_k: 5
  min_similarity: 0.2
  require_citation: true
security:
  roles: [public, customer, agent, admin]
  injection_patterns_file: config/injection_patterns.txt
session:
  inactivity_minutes: 30
  restore_window_hours: 24
  min_context_messages: 10
pipeline:
  update_time: "02:00"
  maintenance_start: "01:00"
  maintenance_end: "04:00"
  retry_minutes: [15, 30, 60]
  health_check_minutes: 5
  health_min_accuracy: 0.8

tickets:
  mandatory: [customer, order_id, issue, contact]
  products: [Smart Speaker, Wireless Earbuds, Air Purifier, Smart Watch]
  sla_hours: {P1: 4, P2: 8, P3: 24, P4: 48}
  warn_at: 0.75
  weekend_days: [5, 6]
  holidays: ["2026-11-10"]
  business_hours: {start: "09:00", end: "18:00"}
  duplicate_window_hours: 72
  waiting_scale_hours: 20
  severity: {account: 5, payment: 4, defect: 3, delivery: 3, other: 1}
  weights: {severity: 0.4, sentiment: 0.2, waiting: 0.2, impact: 0.2}
  thresholds: {P1: 3.0, P2: 2.0, P3: 1.2}

sentiment:
  repeated_negative_count: 3
  unresolved_minutes: 15

multimodal:
  allowed_types: [png, jpg, jpeg, pdf]
  max_mb: 5
  retention_hours: 24
  timeout_seconds: 30
  min_ocr_confidence: 60
  min_sharpness: 200
  min_resolution: 200

access:
  roles:
    viewer: [status]
    operator: [status, run]
    admin: [status, run, rollback]
  users:
    guest: viewer
    ops_user: operator
    admin_user: admin
    scheduler: admin
